<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivaLens — Shadow AI Privacy Shield</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      width: 340px;
      min-height: 420px;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #18181b;
      color: #e4e4e7;
      overflow-x: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(63,63,70,0.5);
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(16,185,129,0.25);
      flex-shrink: 0;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand p {
      font-size: 11px;
      color: #71717a;
      font-weight: 500;
      margin-top: 1px;
    }

    /* ── Status pill ──────────────────────────────────────────────── */
    .status-section {
      padding: 16px 20px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(39,39,42,0.7);
      border: 1px solid rgba(63,63,70,0.5);
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16,185,129,0.5);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.off {
      background: #71717a;
      box-shadow: none;
    }
    .status-label {
      font-size: 13px;
      font-weight: 600;
    }
    .status-label span {
      color: #10b981;
      transition: color 0.3s;
    }
    .status-label span.off {
      color: #71717a;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #3f3f46;
      border-radius: 12px;
      transition: background 0.3s;
    }
    .toggle input:checked + .toggle-track {
      background: #059669;
    }
    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(20px);
    }

    /* ── Stats cards ──────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px 16px;
    }
    .stat-card {
      padding: 16px;
      border-radius: 12px;
      background: rgba(39,39,42,0.5);
      border: 1px solid rgba(63,63,70,0.4);
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }
    .stat-card:hover {
      border-color: rgba(16,185,129,0.3);
      background: rgba(39,39,42,0.7);
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .stat-value.emerald { color: #10b981; }
    .stat-value.cyan    { color: #06b6d4; }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #71717a;
      margin-top: 6px;
    }

    /* ── Info section ─────────────────────────────────────────────── */
    .info-section {
      padding: 0 20px 16px;
    }
    .info-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.15);
    }
    .info-icon {
      font-size: 16px;
      flex-shrink: 0;
    }
    .info-text {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.45;
    }
    .info-text strong {
      color: #67e8f9;
    }

    /* ── Action button ────────────────────────────────────────────── */
    .actions {
      padding: 0 20px 20px;
    }
    .btn-dashboard {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(63,63,70,0.5);
      border-radius: 10px;
      background: rgba(39,39,42,0.6);
      color: #d4d4d8;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-dashboard:hover {
      background: rgba(63,63,70,0.6);
      color: #f4f4f5;
      border-color: rgba(16,185,129,0.3);
    }
    .btn-dashboard:active {
      transform: scale(0.98);
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 12px 20px 16px;
      border-top: 1px solid rgba(63,63,70,0.3);
    }
    .footer p {
      font-size: 10px;
      color: #52525b;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div class="brand">
      <h1>PrivaLens</h1>
      <p>Shadow AI Privacy Shield</p>
    </div>
  </div>

  <div class="status-section">
    <div class="status-pill">
      <div class="status-left">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-label">Protection: <span id="statusText">Active</span></div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleProtection" checked>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value emerald" id="statIntercepted">0</div>
      <div class="stat-label">Threats Intercepted</div>
    </div>
    <div class="stat-card">
      <div class="stat-value cyan" id="statRedacted">0</div>
      <div class="stat-label">Secrets Redacted</div>
    </div>
  </div>

  <div class="info-section">
    <div class="info-card">
      <div class="info-icon">🔐</div>
      <div class="info-text">
        <strong>100% Client-Side.</strong> Your data never leaves your browser. Zero-knowledge privacy by design.
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-dashboard" id="btnDashboard">
      📊 View Audit Log
    </button>
  </div>

  <div class="footer">
    <p>PrivaLens v1.0.0 · Manifest V3</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
